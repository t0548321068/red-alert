<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- פס העריכה: איזה מסך, כמה שינויים -->
<div id="bar">
  <div id="scrName" class="pill"><span id="scrLabel">מסך ראשי</span> ▾</div>
  <div id="chg" class="pill chg0">0 שינויים</div>
</div>
<div id="updBanner" hidden></div>
<!-- המסך המשוכפל -->
<div id="stage">
  <div id="sb"><span id="sbTime"></span></div>
  <div id="screen"></div>
</div>

<!-- חלון העריכה -->
<div id="sheet" hidden>
  <div class="sh-head">
    <div class="sh-titles"><div id="shTitle"></div><div id="shSub"></div></div>
    <div id="shParent" class="link">רכיב מעל ›</div>
  </div>
  <div id="tabs"></div>
  <div id="pane"></div>
  <div class="sh-btns">
    <div id="shReset" class="btn ghost">בלי שינוי</div>
    <div id="shCancel" class="btn">ביטול</div>
    <div id="shSave" class="btn primary">שמירה</div>
  </div>
</div>

<!-- בחירת מסך -->
<div id="menu" class="page" hidden>
  <div class="pg-head"><div class="back" data-close="menu">→</div><div class="pg-title">מסכים</div></div>
  <div id="menuList"></div>
</div>

<!-- שינויים לשליחה -->
<div id="changes" class="page" hidden>
  <div class="pg-head"><div class="back" data-close="changes">→</div><div class="pg-title">שינויים לשליחה</div></div>
  <div id="chgList"></div>
  <div id="sendBtn" class="send">שליחה</div>
  <div id="sentList"></div>
</div>

<!-- כניסה לשרת -->
<div id="login" class="page" hidden>
  <div class="pg-head"><div class="back" data-close="login">→</div><div class="pg-title">כניסה</div></div>
  <div class="card pad">
    <div class="muted">קוד הכניסה של האתר (כמו בניהול צופר) – פעם אחת</div>
    <input id="code" type="password" inputmode="numeric" autocomplete="off">
    <div id="loginErr" class="err"></div>
    <div id="loginBtn" class="send">כניסה ושליחה</div>
  </div>
</div>

<div id="toast" hidden></div>

<script src="kit.js"></script>
<script src="screens.js"></script>
<script src="editor.js"></script>
</body>
</html>
