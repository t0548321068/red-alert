# השרת המשני ב-Cloudflare: oref-proxy (מעבר לפיקוד העורף בשביל השרת הראשי) + גיבוי מלא כשהשרת הראשי לא עונה.
# נפרס מ-GitHub (cloudflare.yml). הסוד KEY (מפתח הממסר) נשמר ב-Cloudflare ולא כאן.
# (גרסה ראשונה של הגיבוי - נובמבר 2026)
name = "oref-proxy"
main = "worker.js"
account_id = "c41a9bf68cba29e0ada409f91d801bb8"
compatibility_date = "2025-09-01"
workers_dev = true

# פעם בדקה: בודקים שהשרת הראשי חי
[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "BACKUP"
class_name = "Backup"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Backup"]

# יומן (Logs) בלוח הבקרה של Cloudflare - לבדיקת תקלות
[observability]
enabled = true
