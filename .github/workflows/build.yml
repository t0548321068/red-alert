name: Build APK

on:
  push:
    branches: [main, beta, 'pending-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --console=plain 2>&1 | tee build.log || {
            grep -E '^e: |error:|Lint found|What went wrong' -A2 build.log | head -30 | sed 's/^/::error::/'
            exit 1
          }

      - name: Read version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      # חתימה: המפתח החדש, עם אישור מעבר מהמפתח הישן - הטלפונים מקבלים את העדכון כרגיל.
      # המפתחות מוצפנים בענף signing, ונפתחים רק כאן עם הסוד SIGNING_PASS
      - name: Sign
        env:
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          set -e
          B=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          W=$(mktemp -d)
          git fetch -q origin signing
          git show FETCH_HEAD:signing.enc | openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -pass env:SIGNING_PASS | tar -x -C $W
          $B/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk $W/aligned.apk
          $B/apksigner sign \
            --ks $W/old.ks --ks-key-alias redalert --ks-pass env:SIGNING_PASS --key-pass env:SIGNING_PASS \
            --next-signer --ks $W/new.ks --ks-key-alias redalert2 --ks-pass env:SIGNING_PASS --key-pass env:SIGNING_PASS \
            --lineage $W/lineage --rotation-min-sdk-version 28 \
            --out red-alert.apk $W/aligned.apk
          rm -rf $W
          $B/apksigner verify -v --print-certs red-alert.apk > verify.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" verify.txt
          grep -E "Verified using|Number of signers" verify.txt

      - uses: actions/upload-artifact@v4
        with:
          name: red-alert-apk
          path: red-alert.apk

      # גרסה ציבורית: מספר גרסה שכבר פורסם - עוצרים (שלא תוחלף גרסה קיימת בשקט ולא יגיע עדכון)
      - name: Check version is new
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.name }}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "::error::גרסה ${{ steps.ver.outputs.name }} כבר פורסמה - צריך להעלות את מספר הגרסה"; exit 1
          fi

      # פרסום כ-Release - ממנו האפליקציה מורידה עדכונים
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: גרסה ${{ steps.ver.outputs.name }}
          files: red-alert.apk
          make_latest: true

      # גרסת בטא: רק מענף beta (כשמבקשים "תעדכן") - מחליפה את הבטא הקודמת
      - name: Beta release
        if: github.ref == 'refs/heads/beta'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          # שם קובץ ייחודי לכל בטא - שלא יורד קובץ ישן מהמטמון
          F=red-alert-${{ steps.ver.outputs.name }}-${{ github.run_number }}.apk
          cp red-alert.apk "$F"
          TITLE="בטא ${{ steps.ver.outputs.name }} · ${{ github.run_number }}"
          NOTES="version=${{ steps.ver.outputs.name }}
          build=${{ github.run_number }}"
          if gh release view beta --repo $R >/dev/null 2>&1; then
            # הגרסה הקיימת לא נמחקת: קודם מעלים את הקובץ החדש, ורק אז מוחקים את הישן - הבטא לא נעלמת אף רגע
            gh release upload beta "$F" --clobber --repo $R
            for a in $(gh release view beta --repo $R --json assets -q '.assets[].name'); do
              [ "$a" != "$F" ] && gh release delete-asset beta "$a" -y --repo $R
            done
            gh release edit beta --repo $R --title "$TITLE" --notes "$NOTES" --prerelease --draft=false
          else
            gh release create beta "$F" --repo $R --prerelease --latest=false --target ${{ github.sha }} \
              --title "$TITLE" --notes "$NOTES"
          fi
          # לפעמים הגרסה נשארת כטיוטה (draft) ואז האפליקציה לא רואה אותה - מפרסמים בכוח
          for i in 1 2 3 4 5; do
            gh release edit beta --repo $R --draft=false --prerelease && \
              gh api repos/$R/releases/tags/beta >/dev/null && break
            sleep 5
          done
          gh api repos/$R/releases/tags/beta >/dev/null
          curl -s -H "Title: Beta" -d "beta" https://ntfy.sh/redalert-tal-beta-7f3k9q

      # התראה מיידית לאפליקציות המותקנות (הן מחוברות לנושא הזה ב-ntfy.sh)
      - name: Notify installed apps
        if: github.ref == 'refs/heads/main'
        run: |
          curl -s -H "Title: New version" -d "${{ steps.ver.outputs.name }}" \
            https://ntfy.sh/redalert-tal-updates-7f3k9q
