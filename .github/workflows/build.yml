name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --console=plain 2>&1 | tee build.log || {
            grep -E '^e: |error:|Lint found|What went wrong' -A2 build.log | head -30 | sed 's/^/::error::/'
            exit 1
          }

      - name: Read version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk red-alert.apk

      - uses: actions/upload-artifact@v4
        with:
          name: red-alert-apk
          path: red-alert.apk

      # פרסום כ-Release - ממנו האפליקציה מורידה עדכונים
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: גרסה ${{ steps.ver.outputs.name }}
          files: red-alert.apk
          make_latest: true

      # גרסת בטא: רק מענף beta (כשמבקשים "תעדכן") - מחליפה את הבטא הקודמת
      - name: Beta release
        if: github.ref == 'refs/heads/beta'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete beta --cleanup-tag -y --repo ${{ github.repository }} || true
          # שם קובץ ייחודי לכל בטא - שלא יורד קובץ ישן מהמטמון
          F=red-alert-${{ steps.ver.outputs.name }}-${{ github.run_number }}.apk
          cp red-alert.apk "$F"
          gh release create beta "$F" --repo ${{ github.repository }} \
            --prerelease --latest=false --target ${{ github.sha }} \
            --title "בטא ${{ steps.ver.outputs.name }} · ${{ github.run_number }}" \
            --notes "version=${{ steps.ver.outputs.name }}
          build=${{ github.run_number }}"
          # לפעמים הבטא נשארת טיוטה (לא נגישה לאפליקציה) - לוודא שהיא מפורסמת
          sleep 3; gh release edit beta --draft=false --repo ${{ github.repository }} || true
          curl -s -H "Title: Beta" -d "beta" https://ntfy.sh/redalert-tal-beta-7f3k9q

      # התראה מיידית לאפליקציות המותקנות (הן מחוברות לנושא הזה ב-ntfy.sh)
      - name: Notify installed apps
        if: github.ref == 'refs/heads/main'
        run: |
          curl -s -H "Title: New version" -d "${{ steps.ver.outputs.name }}" \
            https://ntfy.sh/redalert-tal-updates-7f3k9q
