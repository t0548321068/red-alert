name: tts-sample
on:
  push:
    branches: [tts-sample]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.23-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install edge-tts
      - run: python tools/gen_voice.py
      - run: |
          du -sh app/src/main/assets/voice
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add app/src/main/assets/voice
          git commit -m "Avri voice clips [skip ci]" && git push origin HEAD:v1.23-work
