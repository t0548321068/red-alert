name: tts-sample
on:
  push:
    branches: [tts-sample]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p samples
          for l in he en; do
            curl -s -m 30 -H "Referer: https://www.oref.org.il/" -H "X-Requested-With: XMLHttpRequest" -A "Mozilla/5.0" \
              "https://alerts-history.oref.org.il/Shared/Ajax/GetDistricts.aspx?lang=$l" -o samples/districts_$l.json || true
            ls -la samples/districts_$l.json; head -c 300 samples/districts_$l.json; echo
          done
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add samples && git commit -m "districts [skip ci]" && git push
