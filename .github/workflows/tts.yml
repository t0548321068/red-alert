name: tts-sample
on:
  push:
    branches: [tts-sample]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install gTTS uroman scipy transformers torch --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python gen_more.py
      - run: |
          ls -la samples/more
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add samples && git commit -m "more samples [skip ci]" && git push
