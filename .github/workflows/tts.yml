name: tts-sample
on:
  push:
    branches: [tts-sample]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p samples
          curl -sL -m 120 -A "Mozilla/5.0" -o samples/academy.pdf "https://hebrew-academy.org.il/wp-content/uploads/%D7%A8%D7%A9%D7%99%D7%9E%D7%AA-%D7%A9%D7%9E%D7%95%D7%AA-%D7%94%D7%99%D7%99%D7%A9%D7%95%D7%91%D7%99%D7%9D-%D7%99%D7%95%D7%9C%D7%99-2022.pdf"
          ls -la samples/academy.pdf; file samples/academy.pdf
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add samples && git commit -m "academy pdf [skip ci]" && git push
