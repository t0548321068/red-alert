name: tts-sample
on:
  push:
    branches: [tts-sample]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts
      - run: |
          edge-tts --voice he-IL-AvriNeural --text "צבע אדום. ירי רקטות וטילים. שדרות, איבים, ניר עם. היכנסו למרחב המוגן." --write-media avri.mp3
          edge-tts --voice he-IL-HilaNeural --text "צבע אדום. ירי רקטות וטילים. שדרות, איבים, ניר עם. היכנסו למרחב המוגן." --write-media hila.mp3
          ls -la
      - run: |
          mkdir -p samples && mv *.mp3 samples/
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add samples && git commit -m "voice samples [skip ci]" && git push
