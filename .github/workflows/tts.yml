name: tts-sample
on:
  push:
    branches: [tts-sample]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install edge-tts
      - run: |
          edge-tts --list-voices | grep -i multilingual | tee samples_list.txt || true
          T="צבע אדום. ירי רקטות וטילים. שדרות, איבים, ניר עם. היכנסו למרחב המוגן."
          mkdir -p samples/multi
          for v in $(grep -io '[a-z][a-z]-[A-Z][A-Z]-[A-Za-z]*MultilingualNeural' samples_list.txt | sort -u); do
            n=$(echo $v | sed 's/MultilingualNeural//; s/.*-//')
            SSML=0
            edge-tts --voice $v --text "$T" --write-media samples/multi/$n.mp3 || echo "::warning::fail $v"
          done
          mv samples_list.txt samples/multi/
          ls -la samples/multi
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add samples && git commit -m "multilingual samples [skip ci]" && git push
