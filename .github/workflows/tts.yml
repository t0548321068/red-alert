name: tts-sample
on:
  push:
    branches: [tts-sample]
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install edge-tts
      - run: |
          T="צבע אדום. ירי רקטות וטילים. שדרות, איבים, ניר עם. היכנסו למרחב המוגן."
          edge-tts --voice he-IL-AvriNeural --rate=+12% --pitch=+8Hz --text "$T" --write-media raw.mp3
          ffmpeg -loglevel error -y -i raw.mp3 -af "treble=g=-5:f=3000,silenceremove=start_periods=1:start_threshold=-45dB" -ac 1 -b:a 48k avri2.mp3
          mkdir -p samples && mv avri2.mp3 samples/
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add samples && git commit -m "voice sample 2 [skip ci]" && git push
