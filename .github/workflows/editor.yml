name: Build editor APK

# עריכת צופר 2.0: תצוגה בלבד של העיצוב מחדש של צופר חירום. נבנית ומתפרסמת (גרסה "editor"):
# - מענף editor (שינוי באפליקציית התצוגה עצמה) - עם האפליקציה מענף pending-redesign
# - מענף pending-redesign (כל שינוי בעיצוב) - עם התיקייה editor/ מענף editor. כך כל שינוי מגיע לתצוגה לבד
on:
  push:
    branches: [editor, pending-redesign]
    paths: ['editor/**', 'app/**', '.github/workflows/editor.yml']
  workflow_dispatch:
    inputs:
      app_branch:
        description: 'מאיזה ענף לקחת את צופר חירום (בהפעלה מענף editor)'
        default: pending-redesign

concurrency:
  group: editor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          # עריכת צופר = הקוד של צופר חירום מענף העיצוב מחדש + התיקייה editor/
          if [ "${{ github.ref_name }}" = pending-redesign ]; then
            git fetch -q --depth=1 origin refs/heads/editor && rm -rf editor && git checkout FETCH_HEAD -- editor
          else
            git fetch -q --depth=1 origin "refs/heads/${{ inputs.app_branch || 'pending-redesign' }}" && rm -rf app && git checkout FETCH_HEAD -- app
          fi
          # לא רשומה ב-settings.gradle.kts (שינוי שם בונה ומשחרר את צופר חירום) - נוספת כאן, רק לבנייה הזו
          echo 'include(":editor")' >> settings.gradle.kts
          # הגרסה: אחת יותר מהגרסה שפורסמה אחרונה (2.0.0 -> 2.0.1). אם נקודת ההתחלה ב-build.gradle.kts גבוהה יותר - ממנה
          BASE=$(grep -oP 'editorBase = "\K[^"]+' editor/build.gradle.kts)
          LAST=$(gh release view editor --repo ${{ github.repository }} --json name -q .name 2>/dev/null | grep -oP '\d+(\.\d+)+(?=\s*$)' || true)
          E=$(python3 -c "import sys
          b=[int(x) for x in sys.argv[1].split('.')]; l=[int(x) for x in sys.argv[2].split('.')] if sys.argv[2] else [0]
          print('.'.join(map(str, b if l[:2]!=b[:2] or l<b else l[:2]+[l[2]+1])))" "$BASE" "$LAST")
          echo "EDITOR_VERSION=$E" >> $GITHUB_ENV
          export EDITOR_VERSION=$E
          echo "TITLE=עריכת צופר · $E" >> $GITHUB_ENV
          gradle :editor:assembleRelease --console=plain 2>&1 | tee build.log || {
            grep -E '^e: |error:|Lint found|What went wrong' -A2 build.log | head -30 | sed 's/^/::error::/'
            exit 1
          }
      - name: Sign
        env:
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          set -e
          B=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          W=$(mktemp -d)
          git fetch -q origin signing
          git show FETCH_HEAD:signing.enc | openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -pass env:SIGNING_PASS | tar -x -C $W
          $B/zipalign -f -p 4 editor/build/outputs/apk/release/editor-release-unsigned.apk $W/aligned.apk
          $B/apksigner sign --ks $W/new.ks --ks-key-alias redalert2 --ks-pass env:SIGNING_PASS --key-pass env:SIGNING_PASS \
            --out tzofar-editor.apk $W/aligned.apk
          rm -rf $W
          $B/apksigner verify tzofar-editor.apk
      - name: Publish
        if: github.ref == 'refs/heads/editor' || github.ref == 'refs/heads/pending-redesign'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          if gh release view editor --repo $R >/dev/null 2>&1; then
            gh release upload editor tzofar-editor.apk --clobber --repo $R
            gh release edit editor --repo $R --title "$TITLE" --prerelease --draft=false
          else
            gh release create editor tzofar-editor.apk --repo $R --prerelease --latest=false --target ${{ github.sha }} \
              --title "$TITLE" --notes "תצוגה של העיצוב מחדש של צופר חירום"
          fi
          # עדכון מיידי: עריכות צופר המותקנות מחוברות לנושא הזה ב-ntfy.sh ומתעדכנות לבד (חייב להיות זהה ל-UpdateListener.TOPIC)
          curl -s -H "Title: Editor" -d "editor" https://ntfy.sh/redalert-tal-editor-7f3k9q || true
