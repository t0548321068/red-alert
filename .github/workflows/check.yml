name: Code check

# בדיקת קוד בלבד (קוד מת, אזהרות, משאבים לא בשימוש) - לא בונה גרסה ולא מפרסם כלום.
# רצה כשהקובץ הזה משתנה ב-main, או ידנית.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Compile warnings
        run: |
          gradle :app:compileReleaseKotlin :relay:compileReleaseKotlin :admin:compileReleaseKotlin --rerun-tasks --console=plain 2>&1 | tee compile.log || true
          grep '^w: ' compile.log > warnings.txt || true
          echo "warnings: $(wc -l < warnings.txt)"; sed -E 's#file://.*/red-alert/##' warnings.txt
      - name: Unit tests
        run: |
          gradle :app:testReleaseUnitTest --console=plain > tests.log 2>&1 && echo "TESTS: OK" || { echo "TESTS: FAILED"; grep -E 'FAILED|AssertionError|expected' -A3 tests.log | head -60; }
      - name: Lint
        run: |
          gradle :app:lintRelease :relay:lintRelease :admin:lintRelease --continue --console=plain \
            -Pandroid.lint.checkDependencies=false > lint.log 2>&1 || true
          for m in app relay admin; do
            f=$m/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt
            echo "===== LINT $m"; [ -f $f ] && grep -E '^[^ ].*: (Error|Warning): ' $f | sed -E 's#^.*/(src/main/)#\1#' || echo "(no report)"
          done
      - name: Detekt (unused)
        run: |
          curl -sSL -o detekt.jar https://github.com/detekt/detekt/releases/download/v1.23.7/detekt-cli-1.23.7-all.jar
          cat > detekt.yml <<'Y'
          style:
            active: true
            UnusedPrivateMember: { active: true }
            UnusedPrivateClass: { active: true }
            UnusedPrivateProperty: { active: true }
            UnusedParameter: { active: true }
            UnusedImports: { active: true }
          Y
          java -jar detekt.jar --input app/src/main/java,relay/src/main/java,admin/src/main/java \
            --config detekt.yml --build-upon-default-config \
            --report txt:detekt.txt > detekt.log 2>&1 || true
          tail -5 detekt.log
          grep -E 'Unused' detekt.txt > detekt-unused.txt || true
          echo "unused: $(wc -l < detekt-unused.txt)"
          sed -E 's#^.*/red-alert/##' detekt-unused.txt
      - uses: actions/upload-artifact@v4
        with:
          name: code-check
          path: |
            warnings.txt
            detekt-unused.txt
            detekt.txt
            compile.log
            app/build/reports/lint-results-release.*
            relay/build/reports/lint-results-release.*
            admin/build/reports/lint-results-release.*
