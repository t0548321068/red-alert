name: Build relay APK

# צופר ממסר: אפליקציה נפרדת לטלפון שנשאר בבית. נבנית כשמשהו בתיקייה relay משתנה,
# ומתפרסמת (גרסה "relay" - תמיד הקובץ האחרון באותו קישור) רק מענף relay
on:
  push:
    branches: [relay, 'pending-*']
    paths: ['relay/**', '.github/workflows/relay.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build
        run: |
          set -o pipefail
          gradle :relay:assembleRelease --console=plain 2>&1 | tee build.log || {
            grep -E '^e: |error:|Lint found|What went wrong' -A2 build.log | head -30 | sed 's/^/::error::/'
            exit 1
          }
      - name: Sign
        env:
          SIGNING_PASS: ${{ secrets.SIGNING_PASS }}
        run: |
          set -e
          B=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          W=$(mktemp -d)
          git fetch -q origin signing
          git show FETCH_HEAD:signing.enc | openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -pass env:SIGNING_PASS | tar -x -C $W
          $B/zipalign -f -p 4 relay/build/outputs/apk/release/relay-release-unsigned.apk $W/aligned.apk
          $B/apksigner sign --ks $W/new.ks --ks-key-alias redalert2 --ks-pass env:SIGNING_PASS --key-pass env:SIGNING_PASS \
            --out tzofar-relay.apk $W/aligned.apk
          rm -rf $W
          $B/apksigner verify tzofar-relay.apk
      - name: Publish
        if: github.ref == 'refs/heads/relay'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          if gh release view relay --repo $R >/dev/null 2>&1; then
            gh release upload relay tzofar-relay.apk --clobber --repo $R
            gh release edit relay --repo $R --title "צופר ממסר · ${{ github.run_number }}" --prerelease --draft=false
          else
            gh release create relay tzofar-relay.apk --repo $R --prerelease --latest=false --target ${{ github.sha }} \
              --title "צופר ממסר · ${{ github.run_number }}" --notes "האפליקציה לטלפון שבבית – מעבירה את התרעות פיקוד העורף לשרת"
          fi
