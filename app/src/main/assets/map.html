<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="leaflet/leaflet.css">
<script src="leaflet/leaflet.js"></script>
<style>
  html, body, #map { margin: 0; height: 100%; }
  .leaflet-container { background: #1b1d22; }
  body.light .leaflet-container { background: #e9e9ee; }
  body { font-family: sans-serif; background: #0E0E10; }
  .bar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1000;
         display: flex; gap: 6px; background: rgba(28,28,30,.92); padding: 5px; border-radius: 18px; }
  .bar button { white-space: nowrap; border: 0; background: transparent; color: #ccc; padding: 7px 13px; border-radius: 14px; font-size: 14px; }
  .bar button.on { background: #FF3B30; color: #fff; }
  .legend { position: absolute; bottom: 18px; right: 10px; z-index: 1000; background: rgba(28,28,30,.92);
            color: #eee; padding: 8px 10px; border-radius: 10px; font-size: 12px; line-height: 1.8; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 6px; }
  .empty { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); z-index: 1000;
           background: rgba(28,28,30,.92); color: #eee; padding: 8px 14px; border-radius: 10px; font-size: 14px; display: none; }
  body.light .bar, body.light .legend, body.light .empty { background: rgba(255,255,255,.95); color: #1C1C1E; }
  body.light .bar button { color: #555; }
  .leaflet-popup-content { direction: rtl; text-align: right; }
  .tiles-dark { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9); }
  .base-btn { position: absolute; bottom: 74px; left: 10px; z-index: 1000; height: 34px; padding: 0 12px;
              border-radius: 17px; border: 0; font-size: 13px; color: #eee; background: rgba(28,28,30,.92); }
  body.light .base-btn { color: #1C1C1E; background: rgba(255,255,255,.95); box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .me-btn { position: absolute; bottom: 18px; left: 10px; z-index: 1000; width: 46px; height: 46px;
            border-radius: 50%; border: 0; font-size: 22px; background: rgba(28,28,30,.92); }
  body.light .me-btn { background: rgba(255,255,255,.95); box-shadow: 0 1px 4px rgba(0,0,0,.25); }
</style>
</head>
<body>
<div id="map"></div>
<div class="bar">
  <button data-h="1">שעה</button>
  <button data-h="24" class="on">24 שעות</button>
  <button data-h="168">שבוע</button>
</div>
<button class="me-btn" id="meBtn" title="המיקום שלי">📍</button>
<button class="base-btn" id="baseBtn">🗺 OSM</button>
<div class="empty" id="empty">אין התראות בטווח הזה</div>
<div class="legend">
  <div><span class="dot" style="background:#FF3B30"></span>ירי / חדירה</div>
  <div><span class="dot" style="background:#FF9F0A"></span>התראה מקדימה</div>
  <div><span class="dot" style="background:#30D158"></span>האירוע הסתיים</div>
  <div><span class="dot" style="background:#0A84FF"></span>המיקום שלי</div>
</div>
<script>
  var COLORS = ['#FF3B30', '#FF9F0A', '#30D158'];
  var map = L.map('map', { zoomControl: false, attributionControl: true }).setView([31.6, 34.9], 8);
  var layer = L.layerGroup().addTo(map);
  var DATA = null, AREAS = null, HOURS = 24;
  var ME = null, meLayer = L.layerGroup().addTo(map), HAS_BOUNDS = false;

  // נקרא מהאפליקציה כשיש מיקום עדכני
  function setMe(lat, lon, acc) {
    ME = [lat, lon];
    meLayer.clearLayers();
    if (acc > 0) L.circle(ME, { radius: acc, color: '#0A84FF', weight: 1, fillOpacity: .12 }).addTo(meLayer);
    L.circleMarker(ME, { radius: 8, color: '#fff', weight: 3, fillColor: '#0A84FF', fillOpacity: 1 })
      .bindPopup('המיקום שלי' + (acc > 0 ? ' (±' + Math.round(acc) + ' מ\')' : '')).addTo(meLayer);
    if (!HAS_BOUNDS) map.setView(ME, 14);
  }
  document.getElementById('baseBtn').onclick = function () { setBase(baseKey === 'osm' ? 'esri' : 'osm'); };
  document.getElementById('meBtn').onclick = function () {
    if (ME) map.setView(ME, 15);
    else if (window.App) App.locate();
  };

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(ts) {
    var d = new Date(ts);
    return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function draw() {
    layer.clearLayers();
    if (!DATA) return;
    var since = Date.now() - HOURS * 3600 * 1000;
    // לכל אזור - האירוע האחרון בטווח הזמן קובע את הצבע
    var latest = {};
    DATA.events.forEach(function (e) {
      if (e.ts < since) return;
      e.areas.forEach(function (a) {
        if (!latest[a] || latest[a].ts < e.ts) latest[a] = e;
      });
    });
    var bounds = [];
    Object.keys(latest).forEach(function (name) {
      var info = AREAS[name];
      if (!info) return;
      var e = latest[name], color = COLORS[e.level] || COLORS[0];
      var popup = '<b>' + name + '</b><br>' + e.title + '<br>' + fmt(e.ts);
      var shape = info.p
        ? L.polygon(info.p, { color: color, weight: 1.5, fillOpacity: .45 })
        : L.circleMarker(info.c, { radius: 7, color: color, fillOpacity: .7 });
      shape.bindPopup(popup).addTo(layer);
      bounds.push(info.c);
    });
    document.getElementById('empty').style.display = bounds.length ? 'none' : 'block';
    if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 12 });
    else if (ME) map.setView(ME, 13);
    HAS_BOUNDS = bounds.length > 0;
  }

  // ---- רקע המפה: שני ספקים בלי מפתח, עם החלפה ידנית ומעבר אוטומטי כשיש שגיאות ----
  var BASES = {
    osm: { name: 'OSM', make: function () {
      // שמות בעברית. במצב כהה - היפוך צבעים של אותה מפה
      return L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, className: DATA && DATA.dark ? 'tiles-dark' : '',
        attribution: '&copy; OpenStreetMap' });
    }},
    esri: { name: 'Esri', make: function () {
      var dark = DATA && DATA.dark;
      var g = L.layerGroup();
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/' +
        (dark ? 'Canvas/World_Dark_Gray_Base' : 'World_Street_Map') + '/MapServer/tile/{z}/{y}/{x}',
        { maxZoom: 16, attribution: '&copy; Esri' }).addTo(g);
      if (dark) L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/' +
        'Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(g);
      return g;
    }}
  };
  var base = null, baseKey = null, fails = 0;

  function loadBase() { try { return localStorage.getItem('base') || 'osm'; } catch (e) { return 'osm'; } }
  function setBase(key) {
    if (base) map.removeLayer(base);
    baseKey = key; fails = 0;
    base = BASES[key].make().addTo(map);
    // שגיאות רבות באריחים - עוברים אוטומטית לספק השני
    base.eachLayer ? base.eachLayer(watch) : watch(base);
    try { localStorage.setItem('base', key); } catch (e) {}
    document.getElementById('baseBtn').textContent = '🗺 ' + BASES[key].name;
  }
  function watch(layer) {
    layer.on('tileerror', function () {
      if (++fails === 6) setBase(baseKey === 'osm' ? 'esri' : 'osm');
    });
  }

  // נקרא מהאפליקציה
  function render(data, areas) {
    DATA = data; AREAS = areas;
    if (!data.dark) document.body.classList.add('light');
    setBase(loadBase());
    draw();
  }

  document.querySelectorAll('.bar button').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('.bar button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      HOURS = +b.dataset.h;
      draw();
    };
  });
</script>
</body>
</html>
