<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="leaflet/leaflet.css">
<script src="leaflet/leaflet.js"></script>
<!-- מפת רחובות וקטורית (בסגנון גוגל מפות) מעל Leaflet -->
<link rel="stylesheet" href="maplibre/maplibre-gl.css">
<script src="maplibre/maplibre-gl.js"></script>
<script src="maplibre/leaflet-maplibre-gl.js"></script>
<script src="mapstyle.js"></script>
<!-- כל אזורי ההתרעה בארץ (גבולות + מרכז) - המפה מצוירת מהם, בלי שום שרת חיצוני -->
<script src="areas.js"></script>
<style>
  /* צבעים כמו במסכי האפליקציה (One UI): רקע שחור / אפור בהיר, כרטיסים בגרפיט / לבן, כחול לבחירה */
  :root { --sea: #000000; --land: #1C1C1E; --edge: #3A3A3C; --label: #C7C7CC; --panel: #1C1C1E; --text: #F2F2F7;
          --muted: #8E8E93; --accent: #4C7DFF; }
  body.light { --sea: #F2F2F7; --land: #FFFFFF; --edge: #D1D1D6; --label: #3A3A3C; --panel: #FFFFFF; --text: #1C1C1E;
          --muted: #6E6E73; }
  html, body, #map { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, "Samsung One", sans-serif; background: var(--sea); }
  #map { background: var(--sea); }
  /* רחובות: עד שהאריחים נטענים הם מוסתרים; במצב כהה - המפה הבהירה של OSM הופכת לכהה */
  .leaflet-tile-pane { opacity: 0; }
  body.streets .leaflet-tile-pane { opacity: 1; }
  .legend { position: absolute; bottom: 18px; right: 12px; z-index: 1000; background: var(--panel);
            color: var(--text); padding: 12px 16px; border-radius: 22px; font-size: 13px; line-height: 1.9;
            box-shadow: 0 2px 10px rgba(0,0,0,.25); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 6px; }
  .empty { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1000; white-space: nowrap;
           background: var(--panel); color: var(--text); padding: 10px 18px; border-radius: 22px; font-size: 14px; display: none; }
  .me-btn { position: absolute; bottom: 18px; left: 12px; z-index: 1000; width: 50px; height: 50px; padding: 0;
            border-radius: 50%; border: 0; background: var(--panel); box-shadow: 0 2px 10px rgba(0,0,0,.25);
            display: flex; align-items: center; justify-content: center; }
  .me-btn svg { width: 24px; height: 24px; fill: var(--accent); }
  .lbl { background: transparent; border: 0; box-shadow: none; color: var(--label); font-size: 11px; padding: 0; }
  .lbl::before { display: none; }
  .city { background: transparent; border: 0; box-shadow: none; color: var(--text); font-size: 13px; font-weight: bold;
          padding: 0; text-shadow: 0 0 3px var(--sea), 0 0 3px var(--sea); }
  .city::before { display: none; }
  .pin { background: transparent; border: 0; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  /* מסך ההתרעה: הסיכה נופלת מלמעלה וקופצת קצת */
  .pin.drop svg { animation: pinDrop .65s cubic-bezier(.3,1.45,.55,1) both; transform-origin: 50% 100%; }
  @keyframes pinDrop { 0% { transform: translateY(-70px) scale(.9); opacity: 0; } 35% { opacity: 1; } 100% { transform: none; opacity: 1; } }
  .leaflet-popup-content { direction: rtl; text-align: right; }
  /* מפה קטנה במסך ההתראה: רק המפה והאזורים, בלי כפתורים */
  body.mini .legend, body.mini .me-btn, body.mini .empty { display: none !important; }
  html:has(body.mini), body.mini { background: transparent; }
  body.mini #map { opacity: 0; transition: opacity .35s ease-out; }
  body.mini.ready #map { opacity: 1; }
</style>
</head>
<body>
<!-- מסך ההתרעה פותח את המפה עם #mini=... - מצב קטן מהרגע הראשון, בלי לחכות לאפליקציה -->
<script>if (location.hash.indexOf('#mini=') === 0) document.body.classList.add('mini');
  // עיצוב בהיר מהרגע הראשון (מפה גדולה: #light, מפת ההתרעה: "dark":false)
  if (location.hash === '#light' || location.hash.indexOf('%22dark%22%3Afalse') > 0 || location.hash.indexOf('"dark":false') > 0)
    document.body.classList.add('light');</script>
<div id="map"></div>
<div class="empty" id="empty">אין התראות ב-24 השעות האחרונות</div>
<div class="legend">
  <div><span class="dot" style="background:#FF3B30"></span>ירי / חדירה</div>
  <div><span class="dot" style="background:#FF9F0A"></span>התראה מקדימה</div>
  <div><span class="dot" style="background:#30D158"></span>האירוע הסתיים</div>
  <div><span class="dot" style="background:#0A84FF"></span>המיקום שלי</div>
  <div><span class="dot" style="background:transparent;border:2px dashed #0A84FF;width:7px;height:7px"></span>האזור שלי עכשיו</div>
</div>
<button class="me-btn" id="meBtn" title="המיקום שלי"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 5.2-7 13-7 13S5 14.2 5 9a7 7 0 0 1 7-7zm0 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg></button>
<script>
  var COLORS = ['#FF3B30', '#FF9F0A', '#30D158'];
  // סיכת מיקום על כל מקום בהתרעה אדומה (ירי / חדירה)
  var PIN = L.divIcon({ className: 'pin', iconSize: [26, 34], iconAnchor: [13, 33],
    html: '<svg viewBox="0 0 26 34" width="26" height="34"><path d="M13 1C6.4 1 1 6.3 1 12.8 1 21.6 13 33 13 33s12-11.4 12-20.2C25 6.3 19.6 1 13 1z" fill="#D50000" stroke="#fff" stroke-width="2"/><circle cx="13" cy="12.8" r="4.4" fill="#fff"/></svg>' });
  var PIN_DROP = L.divIcon({ className: 'pin drop', iconSize: PIN.options.iconSize, iconAnchor: PIN.options.iconAnchor, html: PIN.options.html });
  function addPin(a, layer, drop) { if (a && a.c) L.marker(a.c, { icon: drop ? PIN_DROP : PIN, interactive: false, keyboard: false }).addTo(layer); }
  function css(v) { return getComputedStyle(document.body).getPropertyValue(v).trim(); }

  var map = L.map('map', { zoomControl: false, attributionControl: false, preferCanvas: true, minZoom: 7, maxZoom: 18 })
    .setView([31.6, 34.9], 8);

  // רחובות: מפה וקטורית בסגנון גוגל מפות (OpenFreeMap, חינם ובלי מפתח). רק אחרי שבאמת נטענו רחובות -
  // מילוי האזורים נעשה שקוף כדי שיראו אותם. בלי אינטרנט - המפה נשארת כמו קודם
  var TILES_OK = false, STYLE_DARK = !document.body.classList.contains('light');
  // עברית מימין לשמאל בשמות שעל המפה
  // נטען מיד (לא בהשהיה) - אחרת השמות מופיעים רק אחרי זום
  try { maplibregl.setRTLTextPlugin('https://cdn.jsdelivr.net/npm/@mapbox/mapbox-gl-rtl-text@0.3.0/dist/mapbox-gl-rtl-text.js', false); } catch (e) { }
  var streets = null;
  try {
    streets = L.maplibreGL({ style: mapStyle(STYLE_DARK), interactive: false }).addTo(map);
    var gl = streets.getMaplibreMap();
    gl.on('idle', function () {
      if (TILES_OK) return;
      var f = []; try { f = gl.queryRenderedFeatures(); } catch (e) { }
      if (!f.length) return;   // עוד לא נטען כלום (או שאין רשת)
      TILES_OK = true;
      document.body.classList.add('streets');
      baseLayer.eachLayer(function (l) { if (l.setStyle) l.setStyle({ fillOpacity: 0, opacity: 0 }); });
      syncLabels();
    });
  } catch (e) { streets = null; }
  function setStreetsTheme(dark) {
    if (!streets || dark === STYLE_DARK) return;
    STYLE_DARK = dark;
    try { streets.getMaplibreMap().setStyle(mapStyle(dark)); } catch (e) { }
  }

  var baseLayer = L.layerGroup().addTo(map);     // כל האזורים = המפה
  var labelLayer = L.layerGroup();               // שמות - רק כשמתקרבים
  var cityLayer = L.layerGroup();                // ערים גדולות - להתמצאות כשרחוקים
  var CITIES = ['ירושלים', 'תל אביב', 'חיפה', 'באר שבע', 'אשדוד', 'אשקלון', 'נתניה', 'אילת',
                'טבריה', 'קריית שמונה', 'נהריה', 'שדרות', 'עפולה', 'דימונה', 'הרצליה', 'מודיעין'];
  var alertLayer = L.layerGroup().addTo(map);    // אזורים עם התראה
  var visitLayer = L.layerGroup().addTo(map);   // אזורים שהייתי בהם
  var meLayer = L.layerGroup().addTo(map);
  var DATA = { dark: true, all: [], mine: [] }, HOURS = 24, MODE = 'all', ME = null, HAS_BOUNDS = false;

  function drawBase(only) {
    baseLayer.clearLayers(); labelLayer.clearLayers();
    var land = css('--land'), edge = css('--edge');
    Object.keys(ALL_AREAS).forEach(function (name) {
      var a = ALL_AREAS[name];
      if (only && !only.contains(a.c)) return;   // מפת ההתרעה: רק מה שבתצוגה - מהיר
      if (a.p) L.polygon(a.p, { color: edge, weight: .6, opacity: TILES_OK ? 0 : 1, fillColor: land, fillOpacity: TILES_OK ? 0 : 1 })
        .bindPopup(info(name)).addTo(baseLayer);
      L.tooltip({ permanent: true, direction: 'center', className: 'lbl' })
        .setLatLng(a.c).setContent(name).addTo(labelLayer);
    });
    // מרכז כל עיר גדולה = ממוצע מרכזי האזורים שלה
    cityLayer.clearLayers();
    CITIES.forEach(function (city) {
      var pts = Object.keys(ALL_AREAS).filter(function (n) { return n === city || n.indexOf(city + ' - ') === 0; })
                  .map(function (n) { return ALL_AREAS[n].c; });
      if (!pts.length) return;
      var lat = 0, lon = 0; pts.forEach(function (c) { lat += c[0]; lon += c[1]; });
      L.tooltip({ permanent: true, direction: 'center', className: 'city' })
        .setLatLng([lat / pts.length, lon / pts.length]).setContent(city).addTo(cityLayer);
    });
  }
  // שמות היישובים רק מזום 12 - אחרת צפוף מדי
  function syncLabels() {
    if (TILES_OK) {   // עם רחובות - בלי שמות כפולים
      if (map.hasLayer(labelLayer)) map.removeLayer(labelLayer);
      if (map.hasLayer(cityLayer)) map.removeLayer(cityLayer);
      return;
    }
    var near = map.getZoom() >= 12;
    if (near) { if (!map.hasLayer(labelLayer)) labelLayer.addTo(map); if (map.hasLayer(cityLayer)) map.removeLayer(cityLayer); }
    else { if (map.hasLayer(labelLayer)) map.removeLayer(labelLayer); if (!map.hasLayer(cityLayer)) cityLayer.addTo(map); }
  }
  map.on('zoomend', syncLabels);

  function shelter(t) {
    if (t === undefined) return '';
    return t <= 0 ? 'מיידי' : t < 60 ? t + ' שניות' : t === 60 ? 'דקה' : t === 90 ? 'דקה וחצי' : Math.round(t / 60) + ' דקות';
  }
  function info(name) {
    var t = ALL_AREAS[name] && ALL_AREAS[name].t;
    return '<b>' + name + '</b>' + (t !== undefined ? '<br>⏱ זמן להגעה: ' + shelter(t) : '');
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(ts) {
    var d = new Date(ts);
    return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  // התרעה מסוימת שנלחצה ברשימה: מוצגת רק היא, בצבע שלה (ירי באדום, מקדימה בכתום, סיום בירוק)
  var FOCUS = null;
  function drawFocus() {
    alertLayer.clearLayers();
    var color = COLORS[FOCUS.level] || COLORS[0], pts = [];
    FOCUS.names.forEach(function (name) {
      var a = ALL_AREAS[name]; if (!a) return;
      var shape = a.p ? L.polygon(a.p, { color: color, weight: 2.5, fillColor: color, fillOpacity: .6 })
                      : L.circleMarker(a.c, { radius: 9, color: color, fillOpacity: .85 });
      shape.bindPopup(info(name) + '<br>' + FOCUS.title + '<br>' + fmt(FOCUS.ts)).addTo(alertLayer);
      if (FOCUS.level === 0) addPin(a, alertLayer);
      pts = pts.concat(a.p || [a.c]);
    });
    document.getElementById('empty').style.display = 'none';
    HAS_BOUNDS = pts.length > 0;
    if (pts.length) map.fitBounds(pts, { padding: [60, 60], maxZoom: 14 });
  }
  function drawAlerts() {
    if (FOCUS) { drawFocus(); return; }
    alertLayer.clearLayers();
    var since = Date.now() - HOURS * 3600 * 1000, latest = {};
    (DATA[MODE] || []).forEach(function (e) {
      if (e.ts < since) return;
      e.areas.forEach(function (a) { if (!latest[a] || latest[a].ts < e.ts) latest[a] = e; });
    });
    var bounds = [];
    Object.keys(latest).forEach(function (name) {
      var a = ALL_AREAS[name]; if (!a) return;
      var e = latest[name], color = COLORS[e.level] || COLORS[0];
      var shape = a.p ? L.polygon(a.p, { color: color, weight: 2, fillColor: color, fillOpacity: .55 })
                      : L.circleMarker(a.c, { radius: 8, color: color, fillOpacity: .8 });
      shape.bindPopup(info(name) + '<br>' + e.title + '<br>' + fmt(e.ts)).addTo(alertLayer);
      if (e.level === 0) addPin(a, alertLayer);
      bounds.push(a.c);
    });
    var empty = document.getElementById('empty');
    empty.style.display = bounds.length ? 'none' : 'block';
    clearTimeout(window._emptyT);
    if (!bounds.length) window._emptyT = setTimeout(function () { empty.style.display = 'none'; }, 3500);
    HAS_BOUNDS = bounds.length > 0;
    if (HAS_BOUNDS) map.fitBounds(bounds, { padding: [50, 50], maxZoom: 12 });
    else if (ME) map.setView(ME, 12);
  }

  // האזור שבו אני נמצא עכשיו - מסגרת כחולה מקווקוות (יחד עם הנקודה הכחולה)
  function inside(poly, lat, lon) {
    var c = false;
    for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      var yi = poly[i][0], xi = poly[i][1], yj = poly[j][0], xj = poly[j][1];
      if (((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) c = !c;
    }
    return c;
  }
  function drawHere() {
    visitLayer.clearLayers();
    if (!ME) return;
    Object.keys(ALL_AREAS).forEach(function (name) {
      var a = ALL_AREAS[name];
      if (!a.p || !inside(a.p, ME[0], ME[1])) return;
      L.polygon(a.p, { color: '#0A84FF', weight: 2.5, dashArray: '6 5', fillColor: '#0A84FF', fillOpacity: .12, interactive: false })
        .addTo(visitLayer);
    });
  }

  // ---- נקרא מהאפליקציה ----
  function render(data) {
    DATA = data;
    document.body.classList.toggle('light', !data.dark);
    setStreetsTheme(!!data.dark);
    drawBase(); drawAlerts(); syncLabels();
  }
  function setMe(lat, lon, acc) {
    ME = [lat, lon];
    drawHere();
    meLayer.clearLayers();
    if (acc > 0) L.circle(ME, { radius: acc, color: '#0A84FF', weight: 1, fillOpacity: .15, interactive: false }).addTo(meLayer);
    L.circleMarker(ME, { radius: 8, color: '#fff', weight: 3, fillColor: '#0A84FF', fillOpacity: 1 })
      .bindPopup('המיקום שלי' + (acc > 0 ? ' (±' + Math.round(acc) + ' מ\')' : '')).addTo(meLayer);
    if (!HAS_BOUNDS && !FOCUSED) map.setView(ME, 12);
  }

  // מתמקד באזורים של התראה מסוימת (מהרשימה במסך הראשי)
  var FOCUSED = false;
  function focusOn(names, ts, all, level, title) {
    if (!names || !names.length) return;
    if (level != null && level >= 0) {   // התרעה מסוימת - רק היא, בצבע שלה
      FOCUSED = true;
      FOCUS = { names: names, ts: ts, level: level, title: title || '' };
      drawFocus();
      return;
    }
    FOCUSED = true;
    var age = (Date.now() - ts) / 3600000;
    var h = age <= 1 ? 1 : age <= 24 ? 24 : 168;
    HOURS = h; MODE = all ? 'all' : 'mine';
    drawAlerts();
    var pts = [];
    names.forEach(function (n) { var a = ALL_AREAS[n]; if (a) pts = pts.concat(a.p || [a.c]); });
    if (pts.length) map.fitBounds(pts, { padding: [60, 60], maxZoom: 14 });
    alertLayer.eachLayer(function (l) { if (names.some(function (n) { return l.getPopup() && l.getPopup().getContent().indexOf('<b>' + n + '</b>') === 0; })) l.openPopup(); });
  }

  document.getElementById('meBtn').onclick = function () {
    if (ME) map.setView(ME, 14);
    else if (window.App) App.locate();
  };
  // מסך ההתראה: מפה קטנה שמראה את אזורי ההתראה - אפשר לעשות זום (צביטה / לחיצה כפולה) ולהזיז
  function miniMode() {
    document.body.classList.add('mini');
    map.scrollWheelZoom.disable(); map.boxZoom.disable(); map.keyboard.disable();
    // אחרי זום או הזזה - מציירים את האזורים שבתצוגה החדשה
    map.on('moveend', function () {
      if (!document.body.classList.contains('ready')) return;
      drawBase(map.getBounds().pad(0.6));
      alertLayer.eachLayer(function (l) { if (l.bringToFront) l.bringToFront(); });
      syncLabels();
    });
  }
  var MINI_PINS = [], MINI_SHOWN = {}, MINI_PTS = [], MINI_ME = null, MINI_LEVEL = 0;
  function miniShow(names, level, lat, lon) {
    alertLayer.clearLayers(); MINI_PINS = []; MINI_SHOWN = {}; MINI_LEVEL = level;
    names.forEach(function (n) { MINI_SHOWN[n] = 1; });
    var color = COLORS[level] || COLORS[0], pts = [];
    names.forEach(function (n) {
      var a = ALL_AREAS[n]; if (!a) return;
      (a.p ? L.polygon(a.p, { color: color, weight: 2, fillColor: color, fillOpacity: .6, interactive: false })
           : L.circleMarker(a.c, { radius: 8, color: color, fillOpacity: .8, interactive: false })).addTo(alertLayer);
      if (level === 0) MINI_PINS.push(a);   // הסיכות נופלות אחרי שהמפה מוצגת
      pts = pts.concat(a.p || [a.c]);
    });
    // המיקום הנוכחי - נקודה כחולה. נכלל בזום רק אם הוא קרוב (עד 20 ק"מ) - כדי שהאזור יישאר ברור
    var fit = pts.slice();
    if (lat != null && lon != null) {
      L.circleMarker([lat, lon], { radius: 7, color: '#fff', weight: 3, fillColor: '#0A84FF', fillOpacity: 1, interactive: false }).addTo(alertLayer);
      if (pts.length && L.latLngBounds(pts).getCenter().distanceTo([lat, lon]) < 20000) fit.push([lat, lon]);
    }
    MINI_FIT = pts.length ? fit : null;
    MINI_PTS = pts; MINI_ME = (lat != null && lon != null) ? [lat, lon] : null;
    miniFit(0);
  }
  // התרעה נוספת בזמן שהמסך פתוח: האזורים החדשים נוספים למפה, המפה מתרחבת כך שכולם נראים,
  // וכשהיא מגיעה - הסיכות של האזורים החדשים נופלות (הקודמות נשארות במקומן)
  function miniAdd(names) {
    var color = COLORS[MINI_LEVEL] || COLORS[0], add = [];
    names.forEach(function (n) {
      var a = ALL_AREAS[n]; if (!a || MINI_SHOWN[n]) return;
      MINI_SHOWN[n] = 1;
      (a.p ? L.polygon(a.p, { color: color, weight: 2, fillColor: color, fillOpacity: .6, interactive: false })
           : L.circleMarker(a.c, { radius: 8, color: color, fillOpacity: .8, interactive: false })).addTo(alertLayer);
      MINI_PTS = MINI_PTS.concat(a.p || [a.c]);
      add.push(a);
    });
    if (!add.length) return;
    var fit = MINI_PTS.slice();
    if (MINI_ME && L.latLngBounds(MINI_PTS).getCenter().distanceTo(MINI_ME) < 20000) fit.push(MINI_ME);
    MINI_FIT = fit;
    var drop = function () {
      if (MINI_LEVEL === 0) add.forEach(function (a, i) { setTimeout(function () { addPin(a, alertLayer, true); }, 150 + i * 90); });
    };
    // קודם מתמקדים באזור החדש (שם הסיכות נופלות), ואחרי רגע חוזרים לתצוגה של כל האזורים
    var pts = []; add.forEach(function (a) { pts = pts.concat(a.p || [a.c]); });
    clearTimeout(window._miniBack); map.off('moveend', window._miniLand);
    window._miniLand = function () {
      drop();
      window._miniBack = setTimeout(function () {
        map.flyToBounds(MINI_FIT, { padding: [14, 14], maxZoom: 15, duration: 1.0 });
      }, 1800);
    };
    map.once('moveend', window._miniLand);
    map.flyToBounds(pts, { padding: [24, 24], maxZoom: 14, duration: 0.9 });
  }
  // זום קרוב על אזור ההתרעה, בלי אנימציה. מחכה עד שלמפה יש גודל אמיתי
  // (אם מתמקדים לפני כן - יוצאת כל הארץ), ורק אז מציג אותה
  var MINI_FIT = null;
  function miniFit(tries) {
    map.invalidateSize(false);
    var s = map.getSize();
    if ((s.x < 50 || s.y < 50) && tries < 40) { setTimeout(function () { miniFit(tries + 1); }, 50); return; }
    if (MINI_FIT) map.fitBounds(MINI_FIT, { padding: [14, 14], maxZoom: 15, animate: false });
    drawBase(map.getBounds().pad(0.6));
    alertLayer.eachLayer(function (l) { if (l.bringToFront) l.bringToFront(); });   // האזורים מעל הרקע
    syncLabels();
    document.body.classList.add('ready');
    // סיכות המיקום (התרעה אדומה) נופלות באנימציה, אחת אחרי השנייה
    var pins = MINI_PINS; MINI_PINS = [];
    pins.forEach(function (a, i) { setTimeout(function () { addPin(a, alertLayer, true); }, 350 + i * 90); });
  }
  window.addEventListener('resize', function () {
    if (document.body.classList.contains('mini') && MINI_FIT) {
      map.invalidateSize(false); map.fitBounds(MINI_FIT, { padding: [14, 14], maxZoom: 15, animate: false });
    }
  });

  // מצויר מיד, עוד לפני שהאפליקציה שולחת נתונים (במפת ההתרעה - רק אחרי המיקוד, ורק הסביבה)
  if (location.hash.indexOf('#mini=') !== 0) { drawBase(); syncLabels(); }
  // מסך ההתרעה: הנתונים מגיעים בכתובת עצמה (#mini={names,level,lat,lon})
  if (location.hash.indexOf('#mini=') === 0) {
    try {
      var q = JSON.parse(decodeURIComponent(location.hash.substring(6)));
      miniMode(); miniShow(q.names || [], q.level || 0, q.lat, q.lon);
    } catch (e) { document.body.classList.add('ready'); }
  }
</script>
</body>
</html>
