<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="stylesheet" href="leaflet/leaflet.css">
<script src="leaflet/leaflet.js"></script>
<!-- כל אזורי ההתרעה בארץ (גבולות + מרכז) - המפה מצוירת מהם, בלי שום שרת חיצוני -->
<script src="areas.js"></script>
<style>
  :root { --sea: #0f1720; --land: #4a505b; --edge: #626976; --label: #d6d9de; --panel: rgba(28,28,30,.92); --text: #eee; }
  body.light { --sea: #cfe3f3; --land: #ffffff; --edge: #bdb6a8; --label: #33363b; --panel: rgba(255,255,255,.95); --text: #1C1C1E; }
  html, body, #map { margin: 0; height: 100%; }
  body { font-family: sans-serif; }
  #map { background: var(--sea); }
  .bar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1000;
         display: flex; gap: 6px; background: var(--panel); padding: 5px; border-radius: 18px; }
  .bar button { white-space: nowrap; border: 0; background: transparent; color: var(--text); padding: 7px 13px; border-radius: 14px; font-size: 14px; }
  .bar button.on { background: #FF3B30; color: #fff; }
  .legend { position: absolute; bottom: 18px; right: 10px; z-index: 1000; background: var(--panel);
            color: var(--text); padding: 8px 10px; border-radius: 10px; font-size: 12px; line-height: 1.8; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 6px; }
  .empty { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); z-index: 1000; white-space: nowrap;
           background: var(--panel); color: var(--text); padding: 8px 14px; border-radius: 10px; font-size: 14px; display: none; }
  .me-btn { position: absolute; bottom: 18px; left: 10px; z-index: 1000; width: 46px; height: 46px;
            border-radius: 50%; border: 0; font-size: 22px; background: var(--panel); }
  .lbl { background: transparent; border: 0; box-shadow: none; color: var(--label); font-size: 11px; padding: 0; }
  .lbl::before { display: none; }
  .city { background: transparent; border: 0; box-shadow: none; color: var(--text); font-size: 13px; font-weight: bold;
          padding: 0; text-shadow: 0 0 3px var(--sea), 0 0 3px var(--sea); }
  .city::before { display: none; }
  .leaflet-popup-content { direction: rtl; text-align: right; }
</style>
</head>
<body>
<div id="map"></div>
<div class="bar">
  <button data-h="1">שעה</button>
  <button data-h="24" class="on">24 שעות</button>
  <button data-h="168">שבוע</button>
</div>
<div class="empty" id="empty">אין התראות בטווח הזה</div>
<div class="legend">
  <div><span class="dot" style="background:#FF3B30"></span>ירי / חדירה</div>
  <div><span class="dot" style="background:#FF9F0A"></span>התראה מקדימה</div>
  <div><span class="dot" style="background:#30D158"></span>האירוע הסתיים</div>
  <div><span class="dot" style="background:#0A84FF"></span>המיקום שלי</div>
</div>
<button class="me-btn" id="meBtn" title="המיקום שלי">📍</button>
<script>
  var COLORS = ['#FF3B30', '#FF9F0A', '#30D158'];
  function css(v) { return getComputedStyle(document.body).getPropertyValue(v).trim(); }

  var map = L.map('map', { zoomControl: false, attributionControl: false, preferCanvas: true, minZoom: 7, maxZoom: 16 })
    .setView([31.6, 34.9], 8);

  var baseLayer = L.layerGroup().addTo(map);     // כל האזורים = המפה
  var labelLayer = L.layerGroup();               // שמות - רק כשמתקרבים
  var cityLayer = L.layerGroup();                // ערים גדולות - להתמצאות כשרחוקים
  var CITIES = ['ירושלים', 'תל אביב', 'חיפה', 'באר שבע', 'אשדוד', 'אשקלון', 'נתניה', 'אילת',
                'טבריה', 'קריית שמונה', 'נהריה', 'שדרות', 'עפולה', 'דימונה', 'הרצליה', 'מודיעין'];
  var alertLayer = L.layerGroup().addTo(map);    // אזורים עם התראה
  var meLayer = L.layerGroup().addTo(map);
  var DATA = { dark: true, events: [] }, HOURS = 24, ME = null, HAS_BOUNDS = false;

  function drawBase() {
    baseLayer.clearLayers(); labelLayer.clearLayers();
    var land = css('--land'), edge = css('--edge');
    Object.keys(ALL_AREAS).forEach(function (name) {
      var a = ALL_AREAS[name];
      if (a.p) L.polygon(a.p, { color: edge, weight: .6, fillColor: land, fillOpacity: 1 })
        .bindPopup(info(name)).addTo(baseLayer);
      L.tooltip({ permanent: true, direction: 'center', className: 'lbl' })
        .setLatLng(a.c).setContent(name).addTo(labelLayer);
    });
    // מרכז כל עיר גדולה = ממוצע מרכזי האזורים שלה
    cityLayer.clearLayers();
    CITIES.forEach(function (city) {
      var pts = Object.keys(ALL_AREAS).filter(function (n) { return n === city || n.indexOf(city + ' - ') === 0; })
                  .map(function (n) { return ALL_AREAS[n].c; });
      if (!pts.length) return;
      var lat = 0, lon = 0; pts.forEach(function (c) { lat += c[0]; lon += c[1]; });
      L.tooltip({ permanent: true, direction: 'center', className: 'city' })
        .setLatLng([lat / pts.length, lon / pts.length]).setContent(city).addTo(cityLayer);
    });
  }
  // שמות היישובים רק מזום 12 - אחרת צפוף מדי
  function syncLabels() {
    var near = map.getZoom() >= 12;
    if (near) { if (!map.hasLayer(labelLayer)) labelLayer.addTo(map); if (map.hasLayer(cityLayer)) map.removeLayer(cityLayer); }
    else { if (map.hasLayer(labelLayer)) map.removeLayer(labelLayer); if (!map.hasLayer(cityLayer)) cityLayer.addTo(map); }
  }
  map.on('zoomend', syncLabels);

  function shelter(t) {
    if (t === undefined) return '';
    return t <= 0 ? 'מיידי' : t < 60 ? t + ' שניות' : t === 60 ? 'דקה' : t === 90 ? 'דקה וחצי' : Math.round(t / 60) + ' דקות';
  }
  function info(name) {
    var t = ALL_AREAS[name] && ALL_AREAS[name].t;
    return '<b>' + name + '</b>' + (t !== undefined ? '<br>⏱ זמן להגעה: ' + shelter(t) : '');
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(ts) {
    var d = new Date(ts);
    return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function drawAlerts() {
    alertLayer.clearLayers();
    var since = Date.now() - HOURS * 3600 * 1000, latest = {};
    DATA.events.forEach(function (e) {
      if (e.ts < since) return;
      e.areas.forEach(function (a) { if (!latest[a] || latest[a].ts < e.ts) latest[a] = e; });
    });
    var bounds = [];
    Object.keys(latest).forEach(function (name) {
      var a = ALL_AREAS[name]; if (!a) return;
      var e = latest[name], color = COLORS[e.level] || COLORS[0];
      var shape = a.p ? L.polygon(a.p, { color: color, weight: 2, fillColor: color, fillOpacity: .55 })
                      : L.circleMarker(a.c, { radius: 8, color: color, fillOpacity: .8 });
      shape.bindPopup(info(name) + '<br>' + e.title + '<br>' + fmt(e.ts)).addTo(alertLayer);
      bounds.push(a.c);
    });
    var empty = document.getElementById('empty');
    empty.style.display = bounds.length ? 'none' : 'block';
    clearTimeout(window._emptyT);
    if (!bounds.length) window._emptyT = setTimeout(function () { empty.style.display = 'none'; }, 3500);
    HAS_BOUNDS = bounds.length > 0;
    if (HAS_BOUNDS) map.fitBounds(bounds, { padding: [50, 50], maxZoom: 12 });
    else if (ME) map.setView(ME, 12);
  }

  // ---- נקרא מהאפליקציה ----
  function render(data) {
    DATA = data;
    document.body.classList.toggle('light', !data.dark);
    drawBase(); drawAlerts(); syncLabels();
  }
  function setMe(lat, lon, acc) {
    ME = [lat, lon];
    meLayer.clearLayers();
    if (acc > 0) L.circle(ME, { radius: acc, color: '#0A84FF', weight: 1, fillOpacity: .15, interactive: false }).addTo(meLayer);
    L.circleMarker(ME, { radius: 8, color: '#fff', weight: 3, fillColor: '#0A84FF', fillOpacity: 1 })
      .bindPopup('המיקום שלי' + (acc > 0 ? ' (±' + Math.round(acc) + ' מ\')' : '')).addTo(meLayer);
    if (!HAS_BOUNDS) map.setView(ME, 12);
  }

  document.getElementById('meBtn').onclick = function () {
    if (ME) map.setView(ME, 14);
    else if (window.App) App.locate();
  };
  document.querySelectorAll('.bar button').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('.bar button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on'); HOURS = +b.dataset.h; drawAlerts();
    };
  });
  // מצויר מיד, עוד לפני שהאפליקציה שולחת נתונים
  drawBase(); syncLabels();
</script>
</body>
</html>
