<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>צופר חירום – כניסה</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/web.css">
</head>
<body>
<div class="login">
  <form id="f" autocomplete="on">
    <img src="/icon.png" alt="">
    <h1>צופר חירום</h1>
    <p>כניסה עם קוד הגישה</p>
    <input id="code" type="password" autocomplete="current-password" placeholder="קוד גישה" autofocus required>
    <button class="go" type="submit">כניסה</button>
    <div class="err" id="err"></div>
  </form>
</div>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: document.getElementById('code').value }) });
    if (r.ok) return location.replace('/');
    err.textContent = r.status === 429 ? 'יותר מדי ניסיונות – נסה שוב בעוד דקה' : r.status === 503 ? 'עוד לא הוגדר קוד גישה בשרת' : 'קוד שגוי';
  } catch (_) { err.textContent = 'אין חיבור לשרת'; }
};
</script>
</body>
</html>
